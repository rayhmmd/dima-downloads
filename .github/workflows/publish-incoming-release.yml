name: Publish incoming release

on:
  push:
    branches:
      - "incoming/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public download names
        id: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag=$(<release-tag.txt)
          title=$(<release-title.txt)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z: $tag" >&2
            exit 1
          fi
          version=${tag#v}
          expected_assets=$(printf '%s\n' Dima-Installer.dmg "Dima-Setup-$version.exe" | sort)
          checksum_assets=$(awk '{ name=$2; sub(/^\*/, "", name); print name }' SHA256SUMS | sort)
          if [ "$checksum_assets" != "$expected_assets" ]; then
            echo 'SHA256SUMS does not describe exactly the required release assets.' >&2
            exit 1
          fi

          mkdir assembled publish
          for asset in Dima-Installer.dmg "Dima-Setup-$version.exe"; do
            parts=(payload/"$asset".part-*)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No transfer chunks found for $asset." >&2
              exit 1
            fi
            cat "${parts[@]}" > "assembled/$asset"
          done
          (cd assembled && sha256sum --check ../SHA256SUMS)

          cp assembled/Dima-Installer.dmg publish/Dima-Installer.dmg
          cp "assembled/Dima-Setup-$version.exe" "publish/Dima-Setup-$version.exe"
          cp assembled/Dima-Installer.dmg publish/Dima.dmg
          cp "assembled/Dima-Setup-$version.exe" publish/Dima-Setup.exe
          cp SHA256SUMS publish/SHA256SUMS

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create or update the public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing public release $RELEASE_TAG." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" publish/* \
            --target main \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --latest \
            --repo "$GITHUB_REPOSITORY"

      - name: Remove the transfer branch
        shell: bash
        run: git push origin --delete "$GITHUB_REF_NAME"
